<!DOCTYPE html>
<html>

<body>
    <h2>loops in Java Script</h2>
    <p id="demo"></p>
    <script>
          var fruits=["banana","Grapes","Mango","Orange"];

          var text=""
          var i;
          for(i=0 ; i<fruits.length ; i++)
          {
             text += fruits[i] + "<br>"
          }
          document.getElementById("demo").innerHTML=text

    </script>
</body>

</html>
