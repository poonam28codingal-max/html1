<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript Array Methods</h2>
    <h2>join() and pop()</h2>
    <p>The join() method joins array elements into a string and the pop() method removes the last element from an array.
    </p>
    <p id="myjoin"></p>
    <p id="print_array"></p>
    <p id="mypop"></p>
    <script>
        var fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myjoin").innerHTML = fruits.join("  &");
        document.getElementById("print_array").innerHTML = fruits;
        fruits.pop();
        document.getElementById("mypop").innerHTML = fruits;
        
    </script>
</body>

</html>
