<html>
    <head>
        <title>Basic function in html</title>
    </head>
    <body>
        <button onclick="myfunction(6)">Click me</button>
        <script>

            function myfunction(a,b)
            {
                if(b==undefined)
                {
                    b=5;
                }
                document.write(a+b);
            }

        </script>
    </body>
</html>
