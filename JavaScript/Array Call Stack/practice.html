<html>
    <head>
        <title>call stack </title>
    </head>
     <body>
             
        <h2>Javascript Function</h2>
        <p>Do a calculation and then display the result</p>
        <p id="demo"></p>
        <script>
            function  add(a,b)
            {
                return a+b
            }

            function average(a,b) 
            {
                return  add(a,b)/2
            }
            let result=average(9,12)
            document.getElementById("demo").innerHTML=result

              
        </script>
     </body>    

</html>
