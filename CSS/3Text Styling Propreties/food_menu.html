<html>
    <head>
        <title>Food Menue</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                background-color: #672e2e;
                color: #d8adad;
                padding: 20px;
            }
            h1{
                color: #10945d;
            }
            h1+p{
                background-color: #10945d;
                padding: 10px;
                border-radius:8px;
                color: #fff;
                display: inline-block;
        
            }
            ul{
                margin-top:20px;

            }
            ul>li{
                font-size: 18px;
                margin-bottom: 10px;
                font-weight: bold;
                background-color: #10945d;
                padding: 10px;
                border-radius: 8px;
                width: 200px;
                color: #fff;
            }
            ul li:nth-child(3){
                background-color: #285844;
                color: #d8d2d2;
              
            }

        </style>
    </head>
    <body>
        <h1>My Favourite Food Menue</h1>
        <p>Pick up your favourite food items from our menu!</p>
        <ul>
            <li>Pizza</li>
            <li>Burger</li>
            <li>French Fries</li>
            <li>Ice Cream</li>
        </ul>
        <p  class="desc">Every dish on this Menue is made with love and load of flavours. Try them all and Find your favourite!</p>
        <div class="link">
            <a href="#">Order Now</a>
            <a href="#">See More</a>
        </div>
    </body>
</html>
